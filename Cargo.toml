[workspace]
members = [
  "crates/hyperinfer-core",
  "crates/hyperinfer-client",
  "crates/hyperinfer-server",
  "crates/hyperinfer-python",
  "crates/hyperinfer-providers",
  "crates/hyperinfer-router",
]
# PyO3 crates cannot be built as regular Rust libs (they need Python symbols at
# link time).  Exclude from default-members so `cargo build --workspace` works.
default-members = [
  "crates/hyperinfer-core",
  "crates/hyperinfer-client",
  "crates/hyperinfer-server",
  "crates/hyperinfer-providers",
  "crates/hyperinfer-router",
]
resolver = "3"

[workspace.dependencies]
hyperinfer-core = { path = "crates/hyperinfer-core", version = "0.1.1" }
hyperinfer-providers = { path = "crates/hyperinfer-providers", version = "0.1.0" }
hyperinfer-router = { path = "crates/hyperinfer-router", version = "0.1.0" }
hyperinfer-client = { path = "crates/hyperinfer-client", version = "0.2.0" }
hyperinfer-server = { path = "crates/hyperinfer-server", version = "0.1.1" }
