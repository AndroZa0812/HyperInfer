name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names (e.g. hyperinfer-python,hyperinfer-langchain)"
        required: true
        type: string
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: detect changed packages (push) or bump versions (dispatch)
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed || steps.bump.outputs.changed || '[]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect changed packages
        if: github.event_name == 'push'
        id: detect
        run: |
          bun install
          CHANGED=$(bun scripts/get-changed-packages.js)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Bump versions
        if: github.event_name == 'workflow_dispatch'
        id: bump
        run: |
          bun install
          BUMPED=$(bun scripts/bump-versions.js "${{ inputs.packages }}" "${{ inputs.bump }}")
          echo "changed=$BUMPED" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build wheels for each changed package across platforms
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.package }} (${{ matrix.os }})
    needs: prepare
    if: (success() || failure()) && needs.prepare.outputs.changed != '[]' && needs.prepare.outputs.changed != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.changed || '[]') }}
        os: [ubuntu-latest]
        include:
          - package: hyperinfer-python
            os: macos-latest
          - package: hyperinfer-python
            os: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            hyperinfer-python) dir="crates/hyperinfer-python" ;;
            hyperinfer-langchain) dir="bindings/hyperinfer-langchain" ;;
            hyperinfer-llamaindex) dir="bindings/hyperinfer-llamaindex" ;;
            *) echo "Unknown package: ${{ matrix.package }}"; exit 1 ;;
          esac
          echo "PACKAGE_DIR=$dir" >> $GITHUB_ENV
          echo "BUILD_SDIST=false" >> $GITHUB_ENV
          if [ "${{ matrix.package }}" = "hyperinfer-python" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "BUILD_SDIST=true" >> $GITHUB_ENV
          fi

      - name: Setup Rust
        if: matrix.package == 'hyperinfer-python'
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        if: matrix.package == 'hyperinfer-python'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/hyperinfer-python

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        shell: bash
        run: |
          chmod +x scripts/build-package.sh
          ./scripts/build-package.sh "${{ matrix.package }}" "$PACKAGE_DIR" "$BUILD_SDIST"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-dist-${{ matrix.os }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Publish all wheels to TestPyPI via OIDC trusted publishing
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all wheels attached
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ github.sha }}"
          name: "Release ${{ github.sha }}"
          files: dist/*
          draft: false
