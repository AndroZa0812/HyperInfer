name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names (e.g. hyperinfer-python,hyperinfer-langchain)"
        required: true
        type: string
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      rust-bump:
        description: "Rust crate version bump (none to skip)"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
          - patch
          - minor
          - major
        default: none

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: detect changed packages (push) or bump versions (dispatch)
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed || steps.bump.outputs.changed || '[]' }}
      release_tag: ${{ steps.detect.outputs.release_tag || steps.bump.outputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect packages for tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: detect
        run: |
          bun install
          CHANGED=$(bun scripts/get-changed-packages.js)
          if [ "$CHANGED" = "[]" ] || [ -z "$CHANGED" ]; then
            CHANGED='["hyperinfer-python","hyperinfer-langchain","hyperinfer-llamaindex"]'
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Bump versions
        if: github.event_name == 'workflow_dispatch'
        id: bump
        run: |
          bun install
          BUMPED=$(bun scripts/bump-versions.js "${{ inputs.packages }}" "${{ inputs.bump }}")
          VERSION=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("crates/hyperinfer-python/package.json", "utf8")).version)')
          echo "changed=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build wheels for each changed package across platforms
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.package }} (${{ matrix.os }})
    needs: prepare
    if: (success() || failure()) && needs.prepare.outputs.changed != '[]' && needs.prepare.outputs.changed != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.changed || '[]') }}
        os: [ubuntu-latest]
        include:
          - package: hyperinfer-python
            os: macos-latest
          - package: hyperinfer-python
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply version bump
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: node scripts/bump-versions.js "${{ inputs.packages }}" "${{ inputs.bump }}" > /dev/null

      - name: Setup environment
        shell: bash
        run: |
          case "${{ matrix.package }}" in
            hyperinfer-python) dir="crates/hyperinfer-python" ;;
            hyperinfer-langchain) dir="bindings/hyperinfer-langchain" ;;
            hyperinfer-llamaindex) dir="bindings/hyperinfer-llamaindex" ;;
            *) echo "Unknown package: ${{ matrix.package }}"; exit 1 ;;
          esac
          echo "PACKAGE_DIR=$dir" >> $GITHUB_ENV
          echo "BUILD_SDIST=false" >> $GITHUB_ENV
          if [ "${{ matrix.package }}" = "hyperinfer-python" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "BUILD_SDIST=true" >> $GITHUB_ENV
          fi

      - name: Setup Rust
        if: matrix.package == 'hyperinfer-python'
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        if: matrix.package == 'hyperinfer-python'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/hyperinfer-python

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        shell: bash
        run: |
          chmod +x scripts/build-package.sh
          ./scripts/build-package.sh "${{ matrix.package }}" "$PACKAGE_DIR" "$BUILD_SDIST"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-dist-${{ matrix.os }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Publish wheels per package to PyPI via OIDC trusted publishing
  # (each package uses its own GitHub environment so PyPI pending publishers
  # have distinct (owner, repo, workflow, environment) tuples)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.package }} to PyPI
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.changed || '[]') }}
    environment: ${{ matrix.package == 'hyperinfer-python' && 'pypi' || (matrix.package == 'hyperinfer-langchain' && 'pypi-langchain' || 'pypi-llamaindex') }}
    permissions:
      id-token: write
    steps:
      - name: Download ${{ matrix.package }} wheels
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.package }}-dist-*
          path: dist/
          merge-multiple: true

      - name: Publish ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish Rust crates to crates.io via cargo-workspaces
  # ---------------------------------------------------------------------------
  publish-crates:
    name: Publish Rust crates
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.rust-bump != 'none')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --locked

      - name: Bump crate versions
        if: github.event_name == 'workflow_dispatch' && inputs.rust-bump != 'none'
        run: |
          if [ "${{ inputs.rust-bump }}" = "alpha" ] || [ "${{ inputs.rust-bump }}" = "beta" ] || [ "${{ inputs.rust-bump }}" = "rc" ]; then
            cargo ws version --pre-id ${{ inputs.rust-bump }} --exact --no-git-push --no-git-commit --yes
          else
            cargo ws version ${{ inputs.rust-bump }} --exact --no-git-push --no-git-commit --yes
          fi

      - name: Publish crates to crates.io
        run: cargo ws publish --publish-as-is --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --yes

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all wheels attached
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [prepare, publish, publish-crates]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.prepare.outputs.release_tag }}"
          name: "Release ${{ needs.prepare.outputs.release_tag }}"
          generate_release_notes: true
          files: dist/*
          draft: false
