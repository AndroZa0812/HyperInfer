[package]
name = "hyperinfer-router"
version = "0.1.0"
edition = "2021"
description = "Intelligent request routing engine for HyperInfer"
license = "MIT"
repository = "https://github.com/AndroZa0812/HyperInfer"
homepage = "https://github.com/AndroZa0812/HyperInfer"
documentation = "https://docs.rs/hyperinfer-router"
readme = "README.md"
keywords = ["llm", "gateway", "routing", "load-balancing"]
categories = ["api-bindings", "web-programming"]

[features]
default = []

[dependencies]
hyperinfer-core = { path = "../hyperinfer-core", version = "0.1.1" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
redis = { version = "1.2", features = ["aio", "tokio-comp", "connection-manager"] }
tokio = { version = "1.52", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
sha2 = "0.11"
hex = "0.4"
rand = "0.8"
dyn-clone = "1.0.20"

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
