[package]
name = "hyperinfer-client"
version = "0.3.1"
edition = "2021"
description = "High-level client SDK for HyperInfer LLM Gateway"
license = "AGPL-3.0-only"
repository = "https://github.com/AndroZa0812/HyperInfer"
homepage = "https://github.com/AndroZa0812/HyperInfer"
documentation = "https://docs.rs/hyperinfer-client"
readme = "README.md"
keywords = ["llm", "gateway", "client", "sdk"]
categories = ["api-bindings", "web-programming"]

[dependencies]
hyperinfer-core = { path = "../hyperinfer-core", version = "0.2.1" }
hyperinfer-router = { path = "../hyperinfer-router", version = "0.2.1" }
hyperinfer-providers = { path = "../hyperinfer-providers", version = "0.2.1", features = [
  "openai",
  "anthropic",
] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
opentelemetry = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["http-proto"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
http = "1"
bytes = "1"
async-trait = "0.1"
redis = { version = "1.2", features = [
  "aio",
  "tokio-comp",
  "connection-manager",
] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
futures = "0.3"
async-stream = "0.3"
dyn-clone = "1.0.20"
tokio-util = "0.7"
rand = "0.9"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
