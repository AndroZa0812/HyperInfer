[package]
name = "hyperinfer-python"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", features = [
  "tokio-runtime",
  "attributes",
] }
hyperinfer-client = { path = "../hyperinfer-client" }
hyperinfer-core = { path = "../hyperinfer-core" }
hyperinfer-providers = { path = "../hyperinfer-providers" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
chrono = "0.4"
