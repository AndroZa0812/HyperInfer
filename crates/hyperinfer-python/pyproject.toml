[project]
name = "hyperinfer"
version = "0.2.1"
description = "High-performance Python SDK for HyperInfer LLM Gateway"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = ["typing-extensions>=4.0"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/AndroZa0812/HyperInfer"
Repository = "https://github.com/AndroZa0812/HyperInfer"
Issues = "https://github.com/AndroZa0812/HyperInfer/issues"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "hyperinfer._hyperinfer"
# Include py.typed marker and .pyi stub in the wheel.
include = [
  { path = "python/hyperinfer/py.typed", format = "wheel" },
  { path = "python/hyperinfer/_hyperinfer.pyi", format = "wheel" },
]
