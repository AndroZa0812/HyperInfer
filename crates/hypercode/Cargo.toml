[package]
name = "hypercode"
version = "0.1.0"
edition = "2021"
description = "Agentic coding harness built on HyperInfer"
license = "AGPL-3.0-only"
repository = "https://github.com/AndroZa0812/HyperInfer"

[dependencies]
hyperinfer-core = { workspace = true }
hyperinfer-providers = { workspace = true }
hyperinfer-client = { workspace = true }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.23", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
