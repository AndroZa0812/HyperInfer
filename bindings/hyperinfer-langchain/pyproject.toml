[project]
name = "hyperinfer-langchain"
version = "0.2.0"
description = "LangChain integration for HyperInfer LLM Gateway"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "hyperinfer",
    "langchain-core~=1.2",
    "langchain-community~=0.4"
]

[project.urls]
Homepage = "https://github.com/AndroZa0812/HyperInfer"
Repository = "https://github.com/AndroZa0812/HyperInfer"
Issues = "https://github.com/AndroZa0812/HyperInfer/issues"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperinfer_langchain"]

[tool.uv.sources]
hyperinfer = { workspace = true }

[tool.bandit]
exclude_dirs = ["tests", "venv"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.5.1",
]
