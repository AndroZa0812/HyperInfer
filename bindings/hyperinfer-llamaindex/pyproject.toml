[project]
name = "hyperinfer-llamaindex"
version = "0.2.0"
description = "LlamaIndex integration for HyperInfer LLM Gateway"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "hyperinfer",
    "llama-index-core>=0.10"
]

[project.urls]
Homepage = "https://github.com/AndroZa0812/HyperInfer"
Repository = "https://github.com/AndroZa0812/HyperInfer"
Issues = "https://github.com/AndroZa0812/HyperInfer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperinfer_llamaindex"]

[tool.uv.sources]
hyperinfer = { workspace = true }
